services:
  php:
    build: .
    volumes:
      - ./code/:/var/www/html
      - ./tests/:/var/www/html/tests
    working_dir: /var/www/html
    depends_on:
      - redis
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: lab9_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge