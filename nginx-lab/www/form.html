        .radio-group {

        }

            display: flex;

        button {
            width: 100%;
            margin: 20px 0 10px 0;

            color: #2c363d;
            margin-top: 0;

<body>
    
    <form id="myForm" action="process.php" method="POST">

        <input type="text" name="username" placeholder="Введите имя" required>
        <input type="email" name="email" placeholder="Ваш email" required>
        <input type="text" name="birthday" placeholder="Дата рождения">

        <p>Тема</p>
        <select name="theme">
            <option value="Home">Домашний уют</option>
            <option value="Kitchen">Основы кулинарного мастерства</option>
            <option value="Budget">Стратегия личного бюджета</option>
            <option value="Menthal">Психология эмоционального баланса</option>
        </select>

        <div class="checkbox-line">
            <input type="checkbox" name="materials" value="yes"> Материалы включены
        </div>

        <p>Формат участия</p>
        <div class="radio-group">
            <div class="radio-option">
                <input type="radio" name="type" value="Offline" checked> Офлайн
            </div>
            <div class="radio-option">
                <input type="radio" name="type" value="Online"> Онлайн
            </div>
            <div class="radio-option">
                <input type="radio" name="type" value="Hybrid"> Гибрид
            </div>
        </div>

        <button type="submit">Отправить</button>
    </form>

    <div class="nav-links">
        <a href="form.html">Форма</a>
        <a href="index.php">Главная</a>
        <a href="view.php">Все данные</a>
    </div>

    <script>
        document.getElementById("myForm").addEventListener("submit", function(e) {
            const username = document.querySelector("[name='username']").value;
            const email = document.querySelector("[name='email']").value;
            const theme = document.querySelector("[name='theme']").value;
            
            alert(`Вы ввели:\nИмя: ${username}\nEmail: ${email}\nТема: ${theme}`);
            
        
        });
    </script>

</body>
