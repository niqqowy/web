name: PHP Docker CI - Games

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Start Docker containers
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 20

      - name: Check running containers
        run: docker ps

      - name: Check Redis connection
        run: |
          docker compose exec -T php php -r "
          require 'vendor/autoload.php';
          try {
              \$redis = new Predis\Client('tcp://redis:6379');
              \$redis->ping();
              echo 'Redis OK';
          } catch(Exception \$e) {
              echo 'Redis FAIL: ' . \$e->getMessage();
          }
          "

      - name: Install Composer dependencies
        run: docker compose exec -T php composer install --no-interaction

      - name: Run PHPUnit tests
        run: docker compose exec -T php vendor/bin/phpunit tests --colors=always

      - name: Show logs on error
        if: failure()
        run: docker compose logs

      - name: Stop Docker containers
        if: always()
        run: docker compose down